<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantle Trading Arena</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .balance {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .balance-label {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 32px;
      font-weight: 700;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
    }

    .stock {
      font-size: 20px;
      font-weight: 700;
    }

    .price {
      font-size: 32px;
      font-weight: 700;
      margin-top: 8px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="title">Trading Arena</div>
      <div class="subtitle">Tokenized Stock Prediction</div>
    </div>

    <div class="balance">
      <div class="balance-label">Virtual Balance</div>
      <div class="balance-value">10,000 Credits</div>
    </div>

    <div class="card">
      <div class="stock">NVDAX</div>
      <div class="price">$176.42</div>

      <div class="status">
        Prediction market coming soon...
      </div>

      <button id="testButton">
        Test Mini App
      </button>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    document
      .getElementById("testButton")
      .addEventListener("click", function () {
        tg.showAlert("Mini App is working!");
      });
  </script>

</body>
</html>
